// ───── 📋 알림장: 선생님 칠판 알림장 (classes/{반 코드}/notice/board = { day, lines }). 과제 화면 맨 위에
let nbV = null, nbLog = {}, nbAt = null; // nbV: 오늘 칠판(notice/board), nbLog: 지난 알림장 { 날짜: [줄] } (notice/log), nbAt: 보고 있는 날짜 (null = 맨 최근)
function dzBtn(go, kinds) { const b = el("button", { class: "dz", onclick: go }, el("b", {}, "여기로 파일을 끌어다 놓거나"), el("u", {}, "눌러서 파일 고르기"), el("small", {}, kinds)); b.insertAdjacentHTML("afterbegin", '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a4.5 4.5 0 0 1-.6-9A6 6 0 0 1 18 8a4.5 4.5 0 0 1-.5 10"/><path d="M12 20v-9M8.5 14 12 10.5l3.5 3.5"/></svg>'); return b; } // 파일 넣는 점선 상자
function nbDraw() { // 오늘 알림장 (없으면 가장 최근 것). ◀ ▶로 지난 알림장
  const td = new Date().toLocaleDateString("sv-SE"), L = { ...nbLog, ...(nbV?.day === td && nbV.lines?.length ? { [td]: nbV.lines } : {}) };
  const days = Object.keys(L).filter(d => d <= td && L[d]?.length).sort(), i = days.includes(nbAt) ? days.indexOf(nbAt) : days.length - 1;
  $("nb").hidden = !hwOpen || !!hwSel || !days.length; if ($("nb").hidden) return;
  const d = days[i];
  $("nb-d").textContent = "📋 " + new Date(d + "T00:00").toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "long" }) + " 알림장";
  $("nb-l").replaceChildren(...L[d].map(t => el("p", {}, ...hwText(t))));
  $("nb-prev").disabled = i <= 0; $("nb-next").disabled = i >= days.length - 1;
  $("nb-prev").onclick = () => { nbAt = days[i - 1]; nbDraw(); }; $("nb-next").onclick = () => { nbAt = days[i + 1]; nbDraw(); };
}
const nbListen = l => { const a = fs.onSnapshot(fs.doc(db, "classes", l.code, "notice", "board"), s => { nbV = s.data() || null; nbDraw(); }, () => {}),
  b = fs.onSnapshot(fs.doc(db, "classes", l.code, "notice", "log"), s => { nbLog = s.data()?.days || {}; nbDraw(); }, () => {}); return () => { a(); b(); }; };
function hwListen(l) { // 과제 목록을 계속 듣고, 내가 낸 것은 한 번씩 받아 옴
  hwL = l;
  return fs.onSnapshot(fs.collection(db, "classes", l.code, "hw"), async s => {
    hws = s.docs.map(x => ({ id: x.id, ...x.data() })).sort((a, b) => (a.at || 0) - (b.at || 0)); // 나중에 낸 과제가 오른쪽(뒤)
    await Promise.all(hws.filter(x => !(x.id in mine)).map(async x => { const [r, q] = await Promise.all([fs.getDoc(subRef(x.id)).catch(() => null), fs.getDoc(repRef(x.id)).catch(() => null)]); mine[x.id] = r?.exists() ? r.data() : null; reps[x.id] = q?.exists() ? q.data() : null; }));
    if (hwL === l) hwDraw();
  }, () => {});
}
$("hw-btn").onclick = () => { hwOpen = true; hwDraw(); scrollTo(0, 0); };
$("dress-btn").onclick = () => { hwOpen = false; hwDraw(); scrollTo(0, 0); };
// 파일 끌어 놓기: 놓은 곳에서 가까운 파일 칸(카드·창·탭 안의 input[type=file])에 넣고 change를 일으킴. 따로 받는 곳(화이트보드 등)은 그쪽이 먼저
{ let box = null; const STOP = ".card, .pop, section, form, .modal, .hw-it, .hw-new, .card-ed, #panel";
  const find = t => { for (let e = t; e && e !== document.body; e = e.parentElement) { const f = e.querySelector?.("input[type=file]"); if (f) return [e, f]; if (e.matches?.(STOP)) break; } return []; };
  const mark = b => { box?.classList.remove("drop-on"); box = b; box?.classList.add("drop-on"); };
  addEventListener("dragover", e => { if (e.defaultPrevented || !e.dataTransfer?.types.includes("Files")) return; const [b] = find(e.target); mark(b || null); if (b) { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; } });
  addEventListener("dragleave", e => { if (!e.relatedTarget) mark(null); });
  addEventListener("drop", e => { mark(null); if (e.defaultPrevented || !e.dataTransfer?.files.length) return; const [, f] = find(e.target); if (!f) return; e.preventDefault();
    const dt = new DataTransfer(); [...e.dataTransfer.files].slice(0, f.multiple ? 99 : 1).forEach(x => dt.items.add(x)); f.files = dt.files; f.dispatchEvent(new Event("change", { bubbles: true })); });
}
function logout(msg) {
  unsubs.forEach(u => u()); unsubs = []; me = d = null; dirty = false;
  repUnsub?.(); repUnsub = null; hws = []; mine = {}; reps = {}; hwDraft = {}; hwOpen = true; hwL = null; hwSel = null; nbV = null; nbLog = {}; nbAt = null; hwDraw();
  try { localStorage.removeItem("kid-login"); } catch (e) {}
  stepTo(1); $("login-err").textContent = msg || ""; show("login");
}
function enter(l) { // 내 문서와 반 설정을 계속 들음 (점수가 바뀌면 바로 보임)
  unsubs.forEach(u => u()); unsubs = [];
  unsubs.push(hwListen(l), ntListen(l), nbListen(l));
  unsubs.push(fs.onSnapshot(fs.doc(db, "classes", l.code), s => { if (!s.exists()) return logout("학생 입장이 꺼졌어요. 선생님께 물어보세요."); cls = s.data(); if (!cls.dress && !hwOpen) { hwOpen = true; toast("선생님이 꾸미기를 닫았어요."); } if (me) { draw(); hwDraw(); } }, () => {}));
  unsubs.push(fs.onSnapshot(kidRef(l), s => {
    if (!s.exists()) return logout("비밀번호가 지워졌어요. 다시 들어와서 새 비밀번호를 정해요.");
    me = s.data();
    if (!d || !dirty) d = { av: { skin: 0, ...me.av }, wear: avWear(me.wear) };
    show("app"); draw();
  }, () => logout("들어가지 못했어요. 다시 해 볼까요?")));
}
// 들어가기: ① 반 코드·번호 → ② 처음이면 비밀번호 정하기(두 번), 아니면 비밀번호 쓰기
let step = 1, cur = null; // cur = { code, n, name?, first }
function stepTo(n, info) {
  step = n; cur = info || null;
  $("step1").hidden = n !== 1; $("step2").hidden = n !== 2; $("login-back").hidden = n !== 2;
  $("pin2-l").hidden = !(n === 2 && cur.first);
  $("in-pin").value = $("in-pin2").value = "";
  if (n === 2) {
    $("who").replaceChildren(cur.first ? `${cur.name || cur.n + "번"}, 처음 왔네요!` : `${cur.n}번`, el("small", {}, cur.first ? "비밀번호 숫자 4자리를 직접 정해요. 꼭 기억해요!" : "내 비밀번호를 써요"));
    $("pin-l").firstChild.textContent = cur.first ? "새 비밀번호 (숫자 4자리)" : "비밀번호 (숫자 4자리)";
    setTimeout(() => $("in-pin").focus());
  }
  $("login-go").textContent = n === 1 ? "다음" : cur.first ? "이걸로 정하기" : "들어가기";
}
const err = t => $("login-err").textContent = t;
function waitKid(l, ms) { // 선생님 보드가 비밀번호를 받아 내 문서를 만들 때까지
  return new Promise(res => { const t = setTimeout(() => { u(); res(false); }, ms), u = fs.onSnapshot(kidRef(l), s => { if (s.exists()) { clearTimeout(t); u(); res(true); } }, () => {}); });
}
$("login-form").onsubmit = async e => {
  e.preventDefault(); err("");
  $("login-go").disabled = true;
  try {
    if (step === 1) {
      const code = $("in-code").value.trim().toUpperCase(), n = String(parseInt($("in-num").value, 10) || "");
      if (code.length < 4 || !n) return err("반 코드와 번호를 써요.");
      if (!(await fs.getDoc(fs.doc(db, "classes", code))).exists()) return err("반 코드를 찾을 수 없어요. 다시 확인해 봐요.");
      let claim = null;
      try { const c = await fs.getDoc(fs.doc(db, "classes", code, "claim", n)); if (c.exists()) claim = c.data(); } catch (er) {} // 이미 정했으면 못 읽음
      return stepTo(2, { code, n, name: claim?.name, first: !!claim });
    }
    const pin = $("in-pin").value.trim();
    if (!/^\d{4}$/.test(pin)) return err("비밀번호는 숫자 4자리예요.");
    const l = { code: cur.code, key: `${cur.n}-${pin}` };
    if (cur.first) {
      if ($("in-pin2").value.trim() !== pin) return err("두 번 쓴 비밀번호가 달라요. 다시 써요.");
      await fs.updateDoc(fs.doc(db, "classes", cur.code, "claim", cur.n), { pin, at: Date.now() });
      err("선생님 보드에 알리는 중…");
      if (!await waitKid(l, 20000)) return err("선생님 보드가 켜져 있어야 처음 들어올 수 있어요. 선생님께 말하고 다시 해 봐요.");
      err("");
    } else if (!(await fs.getDoc(kidRef(l))).exists()) return err("비밀번호가 맞지 않아요. 잊어버렸으면 선생님께 말해요.");
    try { localStorage.setItem("kid-login", JSON.stringify(l)); } catch (er) {}
    stepTo(1); enter(l);
  } catch (er) { err("연결하지 못했어요. 인터넷 연결을 확인해 주세요."); }
  finally { $("login-go").disabled = false; }
};
$("login-back").onclick = () => { err(""); stepTo(1); };
try { const c = new URLSearchParams(location.search).get("c"); if (c) $("in-code").value = c.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 10); } catch (e) {} // QR로 들어오면 반 코드가 채워짐
$("in-code").oninput = e => e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
$("save").onclick = save;
$("undo").onclick = () => { // 원래대로: 기본 옷(흰 셔츠·카키 반바지)으로. 머리는 그대로, 단 입어 보던(안 산) 머리는 원래 머리로 → 살 것이 없음
  const was = avWear(me.wear).hair, hair = owns(avItem(d.wear.hair)) ? d.wear.hair : owns(avItem(was)) ? was : AV_REQ.hair;
  d = { ...d, wear: { ...d.wear, hair, top: AV_REQ.top, bottom: AV_REQ.bottom } }; dirty = true; draw();

$("out").onclick = async () => { if (await ask(dirty ? "저장하지 않은 것이 있어요.\n그래도 나갈까요?" : "정말 나갈까요?\n다시 들어오려면 번호와 비밀번호를 써야 해요.", "나가기")) logout(); }; // 과제·꾸미기 버튼과 헷갈려 잘못 누를 수 있어서 늘 물어봄
addEventListener("beforeunload", e => { if (dirty) e.preventDefault(); });

try {
  const [app, f] = await Promise.all([import(FB + "firebase-app.js"), import(FB + "firebase-firestore.js")]);
  fs = f; db = fs.getFirestore(app.initializeApp(CFG));
  const l = login();
  if (l) enter(l); else show("login");
} catch (e) { $("loading").textContent = "불러오지 못했어요. 인터넷 연결을 확인하고 새로 고침해 주세요."; }

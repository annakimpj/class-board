<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일지 · 우리반 보드</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 교사 일지: 보드에서 열면 메인 모니터에 뜨는 선생님 전용 창. 달력에서 일정·학생 기록·상담·일지를 바로 (학생 화면에는 안 나옴) */
  :root { --bg: #f6f3ee; --card: #ffffff; --ink: #2b2420; --muted: #8d8279; --line: #e7e0d6; --accent: #3a6ea5; --soft: #edf3fa; --warn: #d9480f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 "Pretendard Variable", "Malgun Gothic", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1.5px solid var(--line); background: #fff; border-radius: 8px; padding: 5px 12px; display: inline-flex; align-items: center; gap: 5px; }
  button:hover { border-color: var(--accent); }
  button.main { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.x { border: 0; background: none; color: #b5aca4; padding: 2px 6px; } button.x:hover { color: var(--warn); }
  input, select, textarea { border: 1.5px solid var(--line); border-radius: 8px; padding: 5px 9px; background: #fff; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  [hidden] { display: none !important; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; gap: 4px; padding: 10px 16px; padding-right: calc(100vw - env(titlebar-area-x, 0px) - env(titlebar-area-width, 100vw) + 16px); background: #fff; border-bottom: 1.5px solid var(--line); flex-wrap: wrap;
           app-region: drag; -webkit-app-region: drag; } /* 머리줄을 잡고 창을 옮겨요 */
  header button, header input { app-region: no-drag; -webkit-app-region: no-drag; }
  header h1 { margin: 0 14px 0 0; font-size: 18px; display: flex; align-items: center; gap: 6px; }
  header .tab { border: 0; background: none; padding: 7px 14px; border-radius: 999px; font-size: 15px; color: var(--muted); }
  header .tab.on { background: var(--soft); color: var(--accent); font-weight: 600; }
  header .dday { border: 0; background: none; padding: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  header .dday .dd { display: inline-flex; align-items: center; gap: 6px; background: var(--soft); border-radius: 8px; padding: 4px 10px; color: var(--ink); }
  header .dday .dd b { font-weight: 600; } header .dday .dn { font-weight: 800; color: var(--accent); }
  header .dday .dw { color: var(--muted); border-left: 1px solid var(--line); padding-left: 6px; }
  header .dday .dd-note { font-size: 11px; color: #b5aaa0; }
  header .dday:hover .dd { box-shadow: inset 0 0 0 1.5px var(--accent); } header .dday:empty::after, header .dday .dd-empty { padding: 4px 10px; }
  header .today { margin-left: 8px; padding-left: 12px; border-left: 1px solid var(--line); font-size: 13px; }
  .ddl { display: grid; gap: 6px; } .ddl .row { display: flex; gap: 6px; align-items: center; } .ddl .row > * { min-width: 0; } .ddl .row .dbox { flex: none; width: 140px; } .ddl .dtext.bad { border-color: #e03131; color: #e03131; }
  .pop .tip { margin: 0 0 4px; font-size: 12px; color: var(--muted); line-height: 1.5; } .ddl .grow { flex: 1; width: 0; } .ddl .row .x { flex: none; }
  header .jset { border: 0; background: none; padding: 5px; border-radius: 8px; color: var(--muted); display: grid; place-items: center; margin-left: 4px; } header .jset:hover { background: var(--soft); color: var(--accent); }
  .setpop { width: 400px; } .stabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .stabs button { border: 0; background: none; padding: 5px 12px; border-radius: 999px; font-size: 14px; color: var(--muted); } .stabs button.on { background: var(--soft); color: var(--accent); font-weight: 600; }
  .spane { display: grid; gap: 10px; min-height: 160px; align-content: start; }
  .sgroup { display: grid; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; } .sgroup h4 { margin: 0; font-size: 13px; color: var(--ink); }
  .sgroup .tip { margin: 0; }
  .pop .chk { display: flex; align-items: center; gap: 6px; font-size: 14px; } .pop .num { width: 64px; } .pop .row .sp { flex: 1; }
  .ddl .sw { width: 30px; height: 28px; padding: 0; border: 0; background: none; flex: none; cursor: pointer; }
  .ring .btns.col { flex-direction: column; align-items: stretch; } .ring .btns .danger { color: #e03131; }
  .pop .wdays { display: flex; gap: 2px; } .pop .wdays button { width: 28px; height: 26px; padding: 0; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; } .pop .wdays button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pop .moderow.col { display: grid; gap: 6px; } .pop .modes .chips { flex: 1; min-width: 0; flex-wrap: wrap; } /* 종류는 왼쪽, 연속·반복은 오른쪽 */
  header .sp { flex: 1; } header .today { color: var(--muted); font-size: 14px; }
  main { min-height: 0; overflow: hidden; padding: 12px 14px; }
  .pane { height: 100%; display: grid; gap: 12px; min-height: 0; }
  .box { background: var(--card); border-radius: 14px; border: 1.5px solid var(--line); padding: 12px 14px; min-height: 0; display: flex; flex-direction: column; }
  .box h2 { margin: 0 0 8px; font-size: 14px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .scroll { overflow-y: auto; min-height: 0; flex: 1; }
  .empty { color: var(--muted); font-size: 13px; padding: 6px 2px; margin: 0; }
  /* 달력 (크게) + 오른쪽 좁게 */
  #p-cal { grid-template-columns: minmax(0, 1fr) 270px; }
  .cal-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; } .cal-head b { font-size: 20px; min-width: 130px; text-align: center; }
  .cal-head .sp { flex: 1; } .cal-head .hint { color: var(--muted); font-size: 12px; }
  .cal { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: auto repeat(6, minmax(0, 1fr)); gap: 4px; }
  .cal .dw { text-align: center; font-size: 13px; color: var(--muted); } .cal .dw.sun { color: #e03131; } .cal .dw.sat { color: #1c7ed6; }
  .day { position: relative; border-radius: 10px; background: #faf8f5; padding: 4px 6px; cursor: pointer; overflow: hidden; border: 1.5px solid transparent; display: flex; flex-direction: column; gap: 2px; min-height: 0; }
  .day:hover { border-color: var(--line); } .day.out { opacity: .45; } .day.sel { border-color: var(--accent); background: var(--soft); }
  .day .top { display: flex; align-items: center; gap: 4px; } .day .n { font-size: 14px; }
  .day.sun .n { color: #e03131; } .day.off .holi { color: #e8590c; background: #fff4e6; border-radius: 4px; padding: 0 4px; } .day .holi { font-size: 11px; color: #e03131; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; } .day.sat .n { color: #1c7ed6; }
  .day.today .n { display: inline-grid; place-items: center; min-width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; }
  .day .marks { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; margin-left: 2px; }
  .day .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .day .mk { width: 14px; height: 14px; } .day .mk.cs { color: #7048e8; } .day .mk.nt { color: #d8cfc5; } .day .mk.nt.on { color: #e8a317; }
  .day .plus { position: absolute; right: 4px; bottom: 4px; width: 24px; height: 24px; padding: 0; justify-content: center; border-radius: 50%; opacity: 0; background: #fff; }
  .day:hover .plus, .day.sel .plus { opacity: 1; }
  .day .evs { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; scrollbar-width: thin; padding-bottom: 22px; }
  .day .ev { flex: none; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 1px 6px; border-radius: 5px; background: #e3ecf6; color: #2c4f75; }
  .day .ev .i, .item .x2 .i { width: 12px; height: 12px; vertical-align: -1px; margin-right: 3px; }
  .spbar { position: relative; z-index: 2; align-self: start; height: 17px; margin: 0 6px; padding: 0 6px; border-radius: 5px; background: #cfe0f2; color: #1f4a73; font-size: 12px; line-height: 17px;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: grab; touch-action: none; user-select: none; }
  .spbar .i { width: 12px; height: 12px; vertical-align: -1px; margin-right: 3px; } .spbar:hover { background: #bdd4ec; } .spbar.done { text-decoration: line-through; opacity: .5; }
  .spbar.cl { margin-left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; } .spbar.cr { margin-right: 0; border-top-right-radius: 0; border-bottom-right-radius: 0; } /* 지난주·다음 주로 이어짐 */
  .pop .modes { gap: 6px; } .pop .mode { flex: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; padding: 4px 10px; } .pop .mode.on { background: var(--soft); border-color: var(--accent); color: var(--accent); }
  .pop .moderow { gap: 6px; font-size: 13px; color: var(--muted); } .pop .moderow .dbox { width: 140px; flex: none; }
  .day .ev:hover { background: #d3e2f3; } .day .ev.done { text-decoration: line-through; opacity: .5; } .day .more { font-size: 11px; color: var(--muted); }
  .side { display: grid; grid-template-rows: auto minmax(0, 1fr) minmax(0, 1fr); gap: 12px; min-height: 0; }
  .ghost { position: fixed; z-index: 50; pointer-events: none; background: var(--accent); color: #fff; font-size: 13px; padding: 3px 10px; border-radius: 8px; box-shadow: 0 6px 18px rgba(0, 0, 0, .2); max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day.drop { border-color: var(--accent); background: #dbe7f5; } .ev.moving { opacity: .4; } .day .ev { cursor: grab; touch-action: none; }
  .minpop { position: fixed; z-index: 40; display: flex; align-items: center; gap: 6px; background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .18); font-size: 14px; }
  .minpop input { width: 64px; }
  .grab { cursor: grab; color: #c9beb3; user-select: none; touch-action: none; padding: 0 2px; } .item[data-id] { cursor: grab; user-select: none; } .item.moving { background: var(--soft); border-radius: 6px; }
  .bell { display: inline-flex; align-items: center; gap: 1px; font-size: 11px; } .bell .i { width: 15px; height: 15px; } .bell.on { color: var(--warn); }
  .pop .addrow { margin-top: 2px; padding-top: 8px; border-top: 1px solid #f1ece5; }
  .inbox { position: relative; flex: 1; min-width: 0; display: flex; } .inbox input[type=text] { flex: 1; min-width: 0; padding-right: 34px; }
  .inbox .clock { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 0; background: none; padding: 3px; color: var(--muted); }
  .inbox .clock:hover { color: var(--accent); } .inbox .tpick { position: absolute; right: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; border: 0; padding: 0; }
  .pop .bell { padding: 4px; } .pop .addrow .bell .i { width: 18px; height: 18px; }
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; } .quick button { justify-content: center; padding: 7px 6px; font-size: 14px; }
  .item { display: flex; align-items: flex-start; gap: 6px; padding: 5px 2px; border-bottom: 1px solid #f1ece5; font-size: 14px; }
  .item .t { font-variant-numeric: tabular-nums; color: var(--accent); font-size: 12.5px; min-width: 40px; padding-top: 1px; }
  .item .x2 { flex: 1; min-width: 0; overflow-wrap: anywhere; cursor: pointer; } .item.done .x2 { text-decoration: line-through; color: var(--muted); }
  .item .d { font-size: 12px; color: var(--muted); min-width: 52px; padding-top: 1px; }
  .h2tip { margin-left: auto; font-size: 11px; font-weight: 400; color: #b5aaa0; }
  .item.stack, .item[data-id], .rec { user-select: none; } /* 더블클릭할 때 글자가 파랗게 골라지지 않게 */
  .item.stack { display: block; cursor: pointer; } .item.stack:hover { background: var(--soft); border-radius: 6px; }
  .item .ihead { display: flex; align-items: center; gap: 6px; font-weight: 600; } .item .ihead .k { margin-top: 0; }
  .item .ibody { margin-top: 3px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .item .k { display: inline-flex; align-items: center; justify-content: center; height: 19px; line-height: 1; font-size: 11px; padding: 0 8px; border-radius: 999px; color: #fff; white-space: nowrap; margin-top: 1px; flex: none; } /* 글자를 동그라미 정가운데로 */
  .sub { font-size: 12.5px; color: var(--muted); margin: 8px 0 2px; font-weight: 600; }
  /* 작은 팝업: 누른 곳 바로 옆에 (일정·학생 기록·상담·일지) */
  .pop-wrap { position: fixed; inset: 0; z-index: 20; }
  .pop { position: fixed; width: 380px; max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); overflow-y: auto; background: #fff; border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; box-shadow: 0 12px 36px rgba(40, 30, 20, .22); border: 1.5px solid var(--line); }
  .pop h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 6px; } .pop h3 input[type=date] { margin-left: auto; font-size: 13px; padding: 2px 6px; }
  .pop .row { display: flex; gap: 6px; align-items: center; } .pop .grow { flex: 1; min-width: 0; }
  .pop textarea { width: 100%; resize: vertical; } .pop select { padding: 4px 6px; }
  .pop .btns { display: flex; justify-content: flex-end; gap: 6px; align-items: center; } .pop .btns .saved { margin-right: auto; }
  .pop .plist { max-height: 140px; overflow-y: auto; } .pop .plist .item { font-size: 13px; padding: 3px 2px; }
  .pop .kidpick { max-height: 120px; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); } .pop .kidpick button { font-size: 13px; padding: 3px 6px; }
  .pop .chips button { font-size: 13px; padding: 2px 9px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; } .chips button { border-radius: 999px; padding: 3px 11px; font-size: 14px; }
  .chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .kidpick { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 4px; max-height: 150px; overflow-y: auto; padding: 2px; }
  .kidpick button { justify-content: flex-start; padding: 4px 8px; font-size: 14px; border-radius: 8px; white-space: nowrap; overflow: hidden; }
  .kidpick button i { font-style: normal; color: var(--muted); font-size: 11px; } .kidpick button.on { background: var(--soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .kidpick button.on i { color: var(--accent); }
  /* 학생 기록 · 상담 일지 목록 */
  #p-rec, #p-cs { grid-template-columns: 220px minmax(0, 1fr); }
  .kids .kid { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; border-radius: 8px; padding: 5px 8px; background: none; }
  .kids .kid:hover { background: #f6f3ee; } .kids .kid.on { background: var(--soft); color: var(--accent); font-weight: 600; }
  .kids .kid i { font-style: normal; color: var(--muted); font-size: 12px; min-width: 22px; } .kids .kid span { flex: 1; } .kids .kid small { color: var(--muted); font-size: 12px; }
  .bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; } .bar .sp { flex: 1; } .bar b { font-size: 17px; } .bar input[type=search] { width: 160px; }
  .rec { display: grid; grid-template-columns: 78px minmax(0, 150px) minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 9px 2px; border-bottom: 1px solid #f1ece5; }
  .rec .d { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; } .rec .who { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
  .rec .k { display: inline-flex; align-items: center; justify-content: center; height: 21px; line-height: 1; vertical-align: 1px; font-size: 12px; padding: 0 8px; border-radius: 999px; color: #fff; margin-right: 6px; }
  .rec .txt { white-space: pre-wrap; overflow-wrap: anywhere; } .rec .acts { display: flex; gap: 2px; }
  .rec.score .txt { color: var(--muted); } .rec.score .k { background: #adb5bd; }
  .rec .meta { font-size: 12.5px; color: var(--muted); display: block; } .rec .next { display: block; margin-top: 4px; color: #6741c4; font-size: 14px; }
  /* 일지 */
  #p-note { grid-template-columns: 220px minmax(0, 1fr); }
  .notehead { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; } .notehead b { font-size: 18px; flex: 1; }
  #note { flex: 1; min-height: 0; resize: none; font-size: 17px; line-height: 1.7; padding: 12px 14px; }
  .dates button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 8px; }
  .dates button:hover { background: #f6f3ee; } .dates button.on { background: var(--soft); color: var(--accent); font-weight: 600; }
  .dates small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: normal; }
  .ring { position: fixed; inset: 0; background: rgba(30, 30, 40, .4); display: grid; place-items: center; z-index: 30; }
  .ring > div { background: #fff; border-radius: 20px; padding: 24px 36px; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, .3); }
  .ring.near { background: none; display: block; } .ring.near > div { position: fixed; max-width: 300px; padding: 12px 16px; border-radius: 12px; box-shadow: 0 8px 28px rgba(0, 0, 0, .22); }
  .ring.near p { font-size: 15px; margin: 0 0 10px; }
  .pop .btns .danger { color: #e03131; margin-right: auto; } .pop .btns .nfoot { margin-right: auto; display: flex; align-items: center; gap: 8px; } .pop .nfoot .danger { margin: 0; }
  .ring b { display: block; font-size: 28px; color: var(--accent); } .ring p { font-size: 20px; margin: 6px 0 16px; white-space: pre-line; } .ring .btns { display: flex; gap: 8px; justify-content: center; }
  .cover { position: fixed; inset: 0; z-index: 40; background: #fbf3e4; display: grid; place-content: center; text-align: center; gap: 6px; user-select: none; }
  .cover b { font-size: 34px; color: #2b1d14; } .cover span { color: #a8927c; font-size: 18px; }
  .print-title { display: none; }
  @media print {
    body { display: block; background: #fff; } header, .kids, .bar, .rec .acts, #p-cal, #p-note, .pop-wrap { display: none !important; }
    main, .pane, .box, .scroll { display: block !important; overflow: visible !important; height: auto !important; border: 0; padding: 0; }
    .pane[hidden], .box:has(> .kids) { display: none !important; } /* 다른 탭과 학생 목록은 출력하지 않음 */
    .print-title { display: block !important; font-size: 17pt; margin: 0 0 6mm; }
    .rec { grid-template-columns: 24mm 34mm 1fr; break-inside: avoid; font-size: 10.5pt; }
  }
</style>
</head>
<body>
<div class="cover" id="cover" hidden title="두 번 누르면 열려요"><b>우리반 보드</b><span id="cover-date"></span></div>
<header>
  <h1 data-i="book">교사 일지</h1>
  <button class="tab" data-tab="cal" data-i="cal">달력</button><button class="tab" data-tab="rec" data-i="pen">학생 기록</button><button class="tab" data-tab="cs" data-i="chat">상담 일지</button><button class="tab" data-tab="note" data-i="note">일지</button>
  <span class="sp"></span><button class="dday" id="dday" title="디데이·재량휴업일 정하기"></button><button class="jset" id="jset" title="설정" aria-label="설정" data-i="gear"></button><span class="today" id="today"></span>
</header>
<main>
  <section class="pane" id="p-cal" hidden>
    <div class="box">
      <div class="cal-head"><button id="cal-prev" aria-label="지난달">◀</button><b id="cal-title"></b><button id="cal-next" aria-label="다음 달">▶</button><button id="cal-today">오늘</button>
        <span class="sp"></span><span class="hint">+로 쓰기 · 누르면 줄 긋기 · 더블클릭으로 수정 · 끌어서 옮기기</span></div>
      <div class="cal" id="cal"></div>
    </div>

    recs.length ? el("p", { class: "sub" }, "학생 기록") : null, ...recs.map(r => el("div", { "data-rid": r.id, class: "item stack", title: "더블클릭으로 수정", ondblclick: ev => recForm(r.date, r, ev.currentTarget) }, el("div", { class: "ihead" }, el("span", { class: "k", style: `background:${kindColor(r.kind)}` }, r.kind), names(r.ps)), el("div", { class: "ibody" }, r.text))),
    cs.length ? el("p", { class: "sub" }, "상담") : null, ...cs.map(c => el("div", { class: "item stack", title: "더블클릭으로 수정", ondblclick: ev => csForm(c.date, c, ev.currentTarget) }, el("div", { class: "ihead" }, el("span", { class: "k", style: "background:#7048e8" }, c.way), names(c.ps) || c.target), el("div", { class: "ibody" }, [c.topic, c.text].filter(Boolean).join("\n")))),
    nt ? el("p", { class: "sub" }, "일지") : null, nt ? el("div", { class: "item stack", title: "더블클릭으로 수정", ondblclick: ev => noteForm(pick, ev.currentTarget) }, el("div", { class: "ibody" }, nt)) : null].filter(Boolean));
  recSortable($("day-list"));
}
$("cal-prev").onclick = () => { month.setMonth(month.getMonth() - 1); calDraw(); };
$("cal-next").onclick = () => { month.setMonth(month.getMonth() + 1); calDraw(); };
$("cal-today").onclick = () => { month = new Date(); month.setDate(1); pick = today(); calDraw(); };
document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => add(b.dataset.add, pick, b));
// 알람: 알람을 켠 일정만 (정시 / 10분 전). 이 창에서만 울림 (학생 화면에는 안 나옴)
const rung = new Set();
setInterval(() => {
  const n = new Date(), now = n.getHours() * 60 + n.getMinutes(), t = today();
  for (const e of J.events) {
    if (!occurs(e, t) || !e.time || !e.alarm || isDone(e, t)) continue;
    const [h, mi] = e.time.split(":").map(Number), at = h * 60 + mi - (+e.alarm || 0), key = e.id + t + "@" + at;
    if (now !== at || rung.has(key)) continue;
    rung.add(key); ask(`⏰ ${+e.alarm ? `${e.alarm}분 뒤` : "지금"} ${e.time}\n${e.text}`, "확인", null);
    if (!jset().mute) try { const a = new AudioContext(); [880, 1175, 880, 1175].forEach((f, i) => { const o = a.createOscillator(), g = a.createGain(), s0 = a.currentTime + i * .18; o.frequency.value = f; o.type = "triangle"; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.18, s0); g.gain.exponentialRampToValueAtTime(.001, s0 + .16); o.start(s0); o.stop(s0 + .16); }); } catch (er) {}
    window.focus();
  }
}, 5000);

// ── 학생 목록 (학생 기록·상담 일지 공통): 고르면 그 학생 것만
function kidList(box, cur, count, set) {
  box.replaceChildren(el("button", { class: "kid" + (!cur ? " on" : ""), onclick: () => set("") }, el("i"), el("span", {}, "전체"), el("small", {}, String(count(""))) ),
    ...people().map(p => el("button", { class: "kid" + (cur === p ? " on" : ""), onclick: () => set(p) }, el("i", {}, numOf(p)), el("span", {}, nameOf(p)), el("small", {}, count(p) ? String(count(p)) : ""))),
    ...(people().length ? [] : [el("p", { class: "empty" }, "보드 ⚙ 설정 → 명단에 학생을 넣어 주세요.")]));
}
async function copyRows(btn, lines) { try { await navigator.clipboard.writeText(lines.join("\n")); btn.textContent = "복사했어요"; setTimeout(() => btn.textContent = "복사", 1500); } catch (e) { ask("복사하지 못했어요.", "확인", null); } }

// ── 📝 학생 기록
let who = "", kindFilter = "";
function scoreLog(p) { // 우리반 점수 기록 (보기만)
  let r = {}; try { r = JSON.parse(localStorage.getItem("reward")) || {}; } catch (e) {}
  return (r.log || []).filter(l => !p || (l.who || []).includes(p) || l.from === p).map(l => ({ score: 1, date: iso(new Date(l.at)), ps: l.who || [], kind: "점수", text: `${l.d > 0 ? "+" : ""}${l.d || ""} ${(r.unit || "점").trim()} ${l.why || ""}`.trim(), at: l.at }));
}
function recRows() {
  const q = $("rec-q").value.trim();
  let rows = J.recs.filter(r => (!who || r.ps.includes(who)) && (!kindFilter || r.kind === kindFilter) && (!q || r.text.includes(q) || names(r.ps).includes(q)));
  if ($("rec-score").checked && !kindFilter) rows = rows.concat(scoreLog(who).filter(r => !q || r.text.includes(q)));
  return rows.filter(r => !recYear || schoolYear(r.date) === +recYear).sort((a, b) => b.date.localeCompare(a.date) || (b.at || 0) - (a.at || 0));
}
function recDraw() {
  kidList($("rec-kids"), who, p => J.recs.filter(r => !p || r.ps.includes(p)).length, p => { who = p; recDraw(); });
  $("rec-filter").replaceChildren(el("option", { value: "" }, "모든 종류"), ...kinds().map(([k]) => el("option", { value: k }, k))); $("rec-filter").value = kindFilter;
  recYear ??= String(schoolYear(today())); yearOpts($("rec-year"), J.recs, recYear);
  $("rec-title").textContent = who ? `${numOf(who)}번 ${nameOf(who)}` : "전체 학생 기록";
  $("rec-ptitle").textContent = `학생 기록 · ${who ? nameOf(who) : "전체"} (${new Date().toLocaleDateString("ko-KR")})`;
  const rows = recRows();
  $("rec-list").replaceChildren(...(rows.length ? rows.map(r => el("div", { class: "rec" + (r.score ? " score" : ""), title: r.score ? "" : "더블클릭으로 수정", ondblclick: ev => { if (!r.score && !ev.target.closest("button")) recForm(r.date, r, ev.currentTarget); } }, el("span", { class: "d" }, short(r.date)), el("span", { class: "who" }, names(r.ps)),
    el("span", { class: "txt" }, el("span", { class: "k", style: r.score ? "" : `background:${kindColor(r.kind)}` }, r.kind), r.text),
    r.score ? el("span") : el("span", { class: "acts" }, el("button", { class: "x", title: "고치기", onclick: ev => recForm(r.date, r, ev.currentTarget) }, "✎"), el("button", { class: "x", title: "지우기", onclick: ev => recDel(r, ev.currentTarget) }, "✕"))))
    : [el("p", { class: "empty" }, "아직 기록이 없어요. '+ 기록'이나 달력에서 써요.")]));
}
$("rec-add").onclick = e => recForm(today(), null, e.currentTarget);
$("rec-year").onchange = e => { recYear = e.target.value; recDraw(); };
$("cs-year").onchange = e => { csYear = e.target.value; csDraw(); };
$("rec-filter").onchange = () => { kindFilter = $("rec-filter").value; recDraw(); };
$("rec-q").oninput = recDraw; $("rec-score").onchange = recDraw;
$("rec-copy").onclick = () => copyRows($("rec-copy"), recRows().map(r => `${r.date} ${names(r.ps)} [${r.kind}] ${r.text}`));
$("rec-print").onclick = () => print();

// ── 💬 상담 일지
let csWho = "", csFilter = "";
function csRows() {
  const q = $("cs-q").value.trim();
  return J.counsels.filter(c => (!csYear || schoolYear(c.date) === +csYear) && (!csWho || c.ps.includes(csWho)) && (!csFilter || c.target === csFilter) && (!q || [c.topic, c.text, c.next, names(c.ps)].some(v => v.includes(q))))
    .sort((a, b) => (b.date + (b.time || "")).localeCompare(a.date + (a.time || "")) || b.at - a.at);
}
function csDraw() {
  kidList($("cs-kids"), csWho, p => J.counsels.filter(c => !p || c.ps.includes(p)).length, p => { csWho = p; csDraw(); });
  $("cs-filter").replaceChildren(el("option", { value: "" }, "모든 대상"), ...targets().map(k => el("option", { value: k }, k))); $("cs-filter").value = csFilter;
  csYear ??= String(schoolYear(today())); yearOpts($("cs-year"), J.counsels, csYear);
  $("cs-title").textContent = csWho ? `${numOf(csWho)}번 ${nameOf(csWho)} 상담` : "전체 상담 일지";
  $("cs-ptitle").textContent = `상담 일지 · ${csWho ? nameOf(csWho) : "전체"} (${new Date().toLocaleDateString("ko-KR")})`;
  const rows = csRows();
  $("cs-list").replaceChildren(...(rows.length ? rows.map(c => el("div", { class: "rec", title: "더블클릭으로 수정", ondblclick: ev => { if (!ev.target.closest("button")) csForm(c.date, c, ev.currentTarget); } }, el("span", { class: "d" }, short(c.date), c.time ? el("span", { class: "meta" }, c.time) : null),
    el("span", { class: "who" }, names(c.ps) || "-", el("span", { class: "meta" }, `${c.target} · ${c.way}`)),
    el("span", { class: "txt" }, c.topic ? el("b", {}, c.topic + (c.text ? "\n" : "")) : null, c.text, c.next ? el("span", { class: "next" }, "→ " + c.next) : null),
    el("span", { class: "acts" }, el("button", { class: "x", title: "고치기", onclick: ev => csForm(c.date, c, ev.currentTarget) }, "✎"), el("button", { class: "x", title: "지우기", onclick: async ev => { if (await ask("이 상담 기록을 지울까요?", "지우기", "취소", ev.currentTarget)) { J.counsels = J.counsels.filter(x => x !== c); store(); csDraw(); } } }, "✕"))))
    : [el("p", { class: "empty" }, "아직 상담 기록이 없어요. '+ 상담 기록'이나 달력에서 써요.")]));
}
$("cs-add").onclick = e => csForm(today(), null, e.currentTarget);
$("cs-filter").onchange = () => { csFilter = $("cs-filter").value; csDraw(); };
$("cs-q").oninput = csDraw;
$("cs-copy").onclick = () => copyRows($("cs-copy"), csRows().map(c => `${c.date}${c.time ? " " + c.time : ""} ${names(c.ps) || "-"} (${c.target}·${c.way}) ${c.topic ? "[" + c.topic + "] " : ""}${c.text}${c.next ? " → " + c.next : ""}`));
$("cs-print").onclick = () => print();

// ── 🗒 일지 (날짜마다)
let nday = today(), saveT = 0;
function noteDraw() {
  $("note-title").textContent = dayName(nday) + (nday === today() ? " · 오늘" : "");
  if (document.activeElement !== $("note") || $("note").dataset.day !== nday) { $("note").value = J.notes[nday] || ""; $("note").dataset.day = nday; }
  const days = Object.keys(J.notes).filter(d => J.notes[d].trim()).sort().reverse();
  $("dates").replaceChildren(...(days.length ? days.map(d => el("button", { class: d === nday ? "on" : "", onclick: () => { nday = d; noteDraw(); } }, dayName(d), el("small", {}, J.notes[d].split("\n")[0]))) : [el("p", { class: "empty" }, "아직 쓴 날이 없어요.")]));
}
const shift = n => { const d = new Date(nday + "T12:00"); d.setDate(d.getDate() + n); nday = iso(d); noteDraw(); };
$("note-prev").onclick = () => shift(-1); $("note-next").onclick = () => shift(1); $("note-today").onclick = () => { nday = today(); noteDraw(); };
$("note").oninput = () => {
  const v = $("note").value, d = $("note").dataset.day;
  if (v.trim()) J.notes[d] = v; else delete J.notes[d];
  $("note-saved").textContent = "저장하는 중…"; clearTimeout(saveT);
  saveT = setTimeout(() => { store(); $("note-saved").textContent = "저장했어요"; noteDraw(); }, 600);
};

// 다른 창(보드)에서 바뀌면 다시 그림: 명단·점수·로그인해서 받은 일지
addEventListener("storage", e => { if (["journal", "roster", "reward", null].includes(e.key)) { load(); if (!document.querySelector(".pop-wrap")) draw(); } });
// 학생이 보는 모니터에 떴으면(#cover) 평범한 보드 화면처럼 덮어 둠. 메인 모니터로 옮긴 뒤 두 번 누르면 열림
const coverSync = () => { $("cover").hidden = location.hash !== "#cover"; };
$("cover-date").textContent = new Date().toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "long" });
$("cover").ondblclick = () => { history.replaceState(null, "", location.pathname); coverSync(); };
addEventListener("hashchange", coverSync); coverSync();
const onBoard = () => { try { const b = opener; if (!b || b.closed) return false; const x = screenX + outerWidth / 2, y = screenY + 20; return x >= b.screenX && x < b.screenX + b.outerWidth && y >= b.screenY && y < b.screenY + b.outerHeight; } catch (e) { return false; } }; // 보드(학생 화면) 위에 있나
const spotSave = () => { if (!$("cover").hidden || onBoard()) return; try { localStorage.setItem("teacher-win", JSON.stringify({ x: screenX, y: screenY, w: outerWidth, h: outerHeight })); } catch (e) {} };
setInterval(spotSave, 4000); addEventListener("pagehide", spotSave);
try { // 선생님이 옮겨 둔 자리와 다르면 그 자리로 (보드가 연 창이라 스스로 옮길 수 있음). 보드 화면을 벗어났으면 덮개를 걷음
  const p = JSON.parse(localStorage.getItem("teacher-win"));
  if (p && opener && (Math.abs(screenX - p.x) > 30 || Math.abs(screenY - p.y) > 30)) { resizeTo(p.w, p.h); moveTo(p.x, p.y); }
  setTimeout(() => { if (location.hash === "#cover" && opener && !onBoard()) { history.replaceState(null, "", location.pathname); coverSync(); } }, 300);
} catch (e) {}
load(); showTab(tab);
setInterval(() => { if (tab === "cal" && !document.querySelector(".pop-wrap, .addmenu")) calDraw(); }, 60000); // 날이 바뀌면 오늘 표시
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일지 · 우리반 보드</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 교사 일지: 보드에서 열면 메인 모니터에 뜨는 선생님 전용 창. 일정 · 학생 행동 기록 · 오늘의 일지 (학생 화면에는 안 나옴) */
  :root { --bg: #f6f3ee; --card: #ffffff; --ink: #2b2420; --muted: #8d8279; --line: #e7e0d6; --accent: #3a6ea5; --soft: #edf3fa; --warn: #d9480f; --good: #2f9e44; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 "Pretendard Variable", "Malgun Gothic", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1.5px solid var(--line); background: #fff; border-radius: 8px; padding: 5px 12px; }
  button:hover { border-color: var(--accent); }
  button.main { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.x { border: 0; background: none; color: #b5aca4; padding: 2px 6px; } button.x:hover { color: var(--warn); }
  input, select, textarea { border: 1.5px solid var(--line); border-radius: 8px; padding: 5px 9px; background: #fff; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  [hidden] { display: none !important; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; gap: 6px; padding: env(titlebar-area-height, 10px) 16px 10px; background: #fff; border-bottom: 1.5px solid var(--line); flex-wrap: wrap; }
  header h1 { margin: 0 12px 0 0; font-size: 19px; }
  header .tab { border: 0; background: none; padding: 7px 14px; border-radius: 999px; font-size: 16px; color: var(--muted); }
  header .tab.on { background: var(--soft); color: var(--accent); font-weight: 600; }
  header .sp { flex: 1; } header .today { color: var(--muted); font-size: 14px; }
  main { min-height: 0; overflow: hidden; padding: 14px 16px; }
  .pane { height: 100%; display: grid; gap: 14px; min-height: 0; }
  .box { background: var(--card); border-radius: 14px; border: 1.5px solid var(--line); padding: 12px 14px; min-height: 0; display: flex; flex-direction: column; }
  .box h2 { margin: 0 0 8px; font-size: 15px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .box h2 .sp { flex: 1; }
  .scroll { overflow-y: auto; min-height: 0; flex: 1; }
  .empty { color: var(--muted); font-size: 14px; padding: 10px 2px; }
  /* 일정 */
  #p-cal { grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr); }
  .cal-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; } .cal-head b { font-size: 18px; min-width: 120px; text-align: center; }
  .cal { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: auto; grid-auto-rows: minmax(0, 1fr); gap: 3px; }
  .cal .dw { text-align: center; font-size: 13px; color: var(--muted); padding-bottom: 2px; } .cal .dw.sun { color: #e03131; } .cal .dw.sat { color: #1c7ed6; }
  .day { border-radius: 8px; background: #faf8f5; padding: 3px 5px; cursor: pointer; overflow: hidden; border: 1.5px solid transparent; display: flex; flex-direction: column; gap: 1px; min-height: 0; }
  .day:hover { border-color: var(--line); } .day.out { opacity: .4; } .day.sel { border-color: var(--accent); background: var(--soft); }
  .day .n { font-size: 13px; } .day.sun .n { color: #e03131; } .day.sat .n { color: #1c7ed6; }
  .day.today .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; }
  .day .ev { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; border-radius: 4px; background: #e3ecf6; color: #2c4f75; }
  .day .ev.done { text-decoration: line-through; opacity: .55; } .day .more { font-size: 11px; color: var(--muted); }
  .side { display: grid; grid-template-rows: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; min-height: 0; }
  .evrow { display: flex; align-items: center; gap: 8px; padding: 6px 2px; border-bottom: 1px solid #f1ece5; }
  .evrow .t { font-variant-numeric: tabular-nums; color: var(--accent); font-size: 13px; min-width: 44px; }
  .evrow .x2 { flex: 1; min-width: 0; overflow-wrap: anywhere; } .evrow.done .x2 { text-decoration: line-through; color: var(--muted); }
  .evrow .d { font-size: 12px; color: var(--muted); min-width: 62px; }
  .add { display: flex; gap: 6px; margin-top: 8px; } .add input[type=text], .add .txt { flex: 1; min-width: 0; } .add input[type=time] { width: 112px; }
  .ring { position: fixed; inset: 0; background: rgba(30, 30, 40, .4); display: grid; place-items: center; z-index: 20; }
  .ring > div { background: #fff; border-radius: 20px; padding: 24px 36px; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, .3); }
  .ring b { display: block; font-size: 30px; color: var(--accent); } .ring p { font-size: 22px; margin: 6px 0 16px; }
  /* 행동 기록 */
  #p-rec { grid-template-columns: 230px minmax(0, 1fr); }
  .kids .kid { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; border-radius: 8px; padding: 6px 8px; background: none; }
  .kids .kid:hover { background: #f6f3ee; } .kids .kid.on { background: var(--soft); color: var(--accent); font-weight: 600; }
  .kids .kid i { font-style: normal; color: var(--muted); font-size: 12px; min-width: 22px; } .kids .kid span { flex: 1; } .kids .kid small { color: var(--muted); font-size: 12px; }
  .recform { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 8px; align-items: start; margin-bottom: 10px; }
  .recform textarea { grid-column: 1 / -1; min-height: 64px; resize: vertical; }
  .kinds { display: flex; gap: 4px; flex-wrap: wrap; } .kinds button { border-radius: 999px; padding: 4px 12px; font-size: 14px; }
  .kinds button.on { color: #fff; border-color: transparent; }
  .recbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; } .recbar .sp { flex: 1; } .recbar input[type=search] { width: 180px; }
  .rec { display: grid; grid-template-columns: 86px 74px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 2px; border-bottom: 1px solid #f1ece5; }
  .rec .d { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; } .rec .who { font-weight: 600; font-size: 14px; }
  .rec .k { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; color: #fff; margin-right: 6px; }
  .rec .txt { white-space: pre-wrap; overflow-wrap: anywhere; } .rec .acts { display: flex; gap: 2px; }
  .rec.score .txt { color: var(--muted); } .rec.score .k { background: #adb5bd; }
  .rec textarea { width: 100%; min-height: 54px; }
  /* 일지 */
  #p-note { grid-template-columns: 220px minmax(0, 1fr); }
  .notehead { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; } .notehead b { font-size: 18px; flex: 1; }
  #note { flex: 1; min-height: 0; resize: none; font-size: 17px; line-height: 1.7; padding: 12px 14px; }
  .dates button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 8px; }
  .dates button:hover { background: #f6f3ee; } .dates button.on { background: var(--soft); color: var(--accent); font-weight: 600; }
  .dates small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: normal; }
  .saved { font-size: 13px; color: var(--muted); }
  /* 학생이 볼 수 있는 모니터에 떴을 때 덮개 */
  .cover { position: fixed; inset: 0; z-index: 30; background: #fbf3e4; display: grid; place-content: center; text-align: center; gap: 6px; cursor: default; user-select: none; }
  .cover b { font-size: 34px; color: #2b1d14; } .cover span { color: #a8927c; font-size: 18px; }
  @media print {
    body { display: block; background: #fff; } header, .no-print, #p-cal, #p-note, .kids, .recform, .recbar, .rec .acts { display: none !important; }
    main, .pane, .box { display: block !important; overflow: visible !important; height: auto !important; border: 0; padding: 0; }
    .scroll { overflow: visible; } .print-title { display: block !important; font-size: 18pt; margin: 0 0 6mm; }
    .rec { grid-template-columns: 26mm 22mm 1fr; break-inside: avoid; font-size: 11pt; }
  }
  .print-title { display: none; }
</style>
</head>
<body>
<div class="cover" id="cover" hidden title="두 번 누르면 열려요"><b>우리반 보드</b><span id="cover-date"></span></div>
<header>
  <h1>📓 교사 일지</h1>
  <button class="tab" data-tab="cal">📅 일정</button><button class="tab" data-tab="rec">📝 학생 행동 기록</button><button class="tab" data-tab="note">🗒️ 오늘의 일지</button>
  <span class="sp"></span><span class="today" id="today"></span>
</header>
<main>
  <!-- 일정: 달력 + 고른 날 일정 + 앞으로 7일 -->
  <section class="pane" id="p-cal" hidden>
    <div class="box">
      <div class="cal-head"><button id="cal-prev" aria-label="지난달">◀</button><b id="cal-title"></b><button id="cal-next" aria-label="다음 달">▶</button><button id="cal-today">오늘</button></div>
      <div class="cal" id="cal"></div>
    </div>
    <div class="side">
      <div class="box"><h2 id="day-title"></h2><div class="scroll" id="day-list"></div>
        <form class="add" id="ev-form"><input type="time" id="ev-time" title="시간 (비워도 돼요). 시간을 넣으면 그때 이 창에서 알려 줘요"><input type="text" id="ev-text" placeholder="일정 (예: 학년 협의회, 출장)" autocomplete="off"><button class="main">추가</button></form>
      </div>
      <div class="box"><h2>앞으로 7일</h2><div class="scroll" id="week-list"></div></div>
    </div>
  </section>
  <!-- 학생 행동 기록 -->
  <section class="pane" id="p-rec" hidden>
    <div class="box"><h2>학생</h2><div class="scroll kids" id="kids"></div></div>
    <div class="box">
      <p class="print-title" id="print-title"></p>
      <div class="recform">
        <select id="rec-who" aria-label="학생"></select><input type="date" id="rec-date" aria-label="날짜">
        <div class="kinds" id="rec-kinds"></div>
        <textarea id="rec-text" placeholder="있었던 일, 지도한 내용 (Ctrl+Enter로 저장)"></textarea>
        <span></span><span></span><div style="text-align:right"><button class="main" id="rec-save">기록 저장</button></div>
      </div>
      <div class="recbar"><b id="rec-title"></b><span class="sp"></span>
        <select id="rec-filter" aria-label="종류로 보기"></select><input type="search" id="rec-q" placeholder="찾기">
        <label class="no-print" title="우리반 점수의 칭찬해요·노력해요 기록도 함께"><input type="checkbox" id="rec-score"> 점수 기록도</label>
        <button id="rec-copy" title="보이는 기록을 글로 복사 (생기부 쓸 때)">복사</button><button id="rec-print">출력</button></div>
      <div class="scroll" id="rec-list"></div>
    </div>
  </section>
  <!-- 오늘의 일지: 날짜마다 자유롭게 -->
  <section class="pane" id="p-note" hidden>
    <div class="box"><h2>쓴 날</h2><div class="scroll dates" id="dates"></div></div>
    <div class="box">
      <div class="notehead"><button id="note-prev" aria-label="전날">◀</button><b id="note-title"></b><button id="note-next" aria-label="다음 날">▶</button><button id="note-today">오늘</button><span class="saved" id="note-saved"></span></div>
      <textarea id="note" placeholder="오늘 수업, 생활지도, 전달할 것… 쓰는 대로 저장돼요."></textarea>
    </div>
  </section>
</main>
<script>
// 저장: localStorage "journal" = { events: [{ id, date, time, text, done }], recs: [{ id, date, p(학생), kind, text, at }], notes: { "YYYY-MM-DD": 글 } }
// 보드와 같은 저장소라 보드가 로그인해 두면 서버에도 올라감 (보드가 storage 이벤트로 알아챔, 보드가 꺼져 있으면 sync-dirty로 다음에)
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) k.startsWith("on") ? e[k] = v : e.setAttribute(k, v); e.append(...kids.flat().filter(x => x != null && x !== false)); return e; };
const iso = d => d.toLocaleDateString("sv-SE");
const today = () => iso(new Date());
const dayName = s => { const d = new Date(s + "T12:00"); return d.toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "short" }); };
const KINDS = [["칭찬", "#2f9e44"], ["생활지도", "#e8590c"], ["상담", "#7048e8"], ["학습", "#1c7ed6"], ["교우관계", "#d6336c"], ["기타", "#868e96"]];
const kindColor = k => (KINDS.find(x => x[0] === k) || KINDS[5])[1];
let J = { events: [], recs: [], notes: {} };
function load() { try { J = Object.assign({ events: [], recs: [], notes: {} }, JSON.parse(localStorage.getItem("journal")) || {}); } catch (e) {} }
function store() { try { localStorage.setItem("journal", JSON.stringify(J)); localStorage.setItem("sync-dirty", "1"); } catch (e) { ask("저장할 자리가 모자라요.", "확인", null); } }
// 창 안 팝업 (브라우저 기본 알림창 대신)
function ask(text, ok = "확인", cancel = "취소") {
  return new Promise(res => {
    const done = v => { m.remove(); res(v); };
    const m = el("div", { class: "ring" }, el("div", {}, el("p", { style: "font-size:17px;white-space:pre-line" }, text), el("div", { style: "display:flex;gap:8px;justify-content:center" },
      cancel ? el("button", { onclick: () => done(false) }, cancel) : null, el("button", { class: "main", onclick: () => done(true) }, ok))));
    document.body.append(m); m.querySelector(".main").focus();
  });
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function people() { // 보드 명단과 같은 규칙: "1번 김하늘"
  const v = (localStorage.getItem("roster") || "").trim(), lines = [...new Set(v.split("\n").map(s => s.trim()).filter(Boolean))];
  if (/^\d+$/.test(v)) return Array.from({ length: Math.min(+v, 200) }, (_, i) => (i + 1) + "번");
  return lines.map((l, i) => { if (/^\d+$/.test(l)) return l + "번"; const m = l.match(/^(\d+)\s*(?:번|\.|\)|-)?\s*(.+)$/); return m ? `${m[1]}번 ${m[2]}` : `${i + 1}번 ${l}`; });
}
const nameOf = p => p.replace(/^\d+번 /, ""), numOf = p => (p.match(/^(\d+)번/) || [])[1] || "";

// ── 탭
let tab = localStorage.getItem("journal-tab") || "cal";
function showTab(t) {
  tab = t; try { localStorage.setItem("journal-tab", t); } catch (e) {}
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  ["cal", "rec", "note"].forEach(k => $("p-" + k).hidden = k !== t);
  draw();
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => showTab(b.dataset.tab));
function draw() { $("today").textContent = new Date().toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" }); if (tab === "cal") calDraw(); else if (tab === "rec") recDraw(); else noteDraw(); }

// ── 📅 일정
let month = new Date(), pick = today();
month.setDate(1);
const evOf = d => J.events.filter(e => e.date === d).sort((a, b) => (a.time || "99").localeCompare(b.time || "99"));
function evRow(e, showDate) {
  const cb = el("input", { type: "checkbox", title: "했어요" }); cb.checked = !!e.done;
  cb.onchange = () => { e.done = cb.checked; store(); calDraw(); };
  return el("div", { class: "evrow" + (e.done ? " done" : "") }, cb, showDate ? el("span", { class: "d" }, dayName(e.date).replace(/\(.\)$/, "")) : null, el("span", { class: "t" }, e.time || ""), el("span", { class: "x2" }, e.text),
    el("button", { class: "x", title: "지우기", onclick: async () => { if (await ask(`'${e.text}' 일정을 지울까요?`, "지우기")) { J.events = J.events.filter(x => x !== e); store(); calDraw(); } } }, "✕"));
}
function calDraw() {
  const y = month.getFullYear(), m = month.getMonth(), first = new Date(y, m, 1), start = new Date(y, m, 1 - first.getDay()), t = today();
  $("cal-title").textContent = `${y}년 ${m + 1}월`;
  const cells = ["일", "월", "화", "수", "목", "금", "토"].map((d, i) => el("div", { class: "dw" + (i === 0 ? " sun" : i === 6 ? " sat" : "") }, d));
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i); const s = iso(d), evs = evOf(s), wd = d.getDay();
    cells.push(el("div", { class: `day${d.getMonth() !== m ? " out" : ""}${s === t ? " today" : ""}${s === pick ? " sel" : ""}${wd === 0 ? " sun" : wd === 6 ? " sat" : ""}`, onclick: () => { pick = s; calDraw(); $("ev-text").focus(); } },
      el("span", { class: "n" }, String(d.getDate())), ...evs.slice(0, 3).map(e => el("span", { class: "ev" + (e.done ? " done" : ""), title: `${e.time ? e.time + " " : ""}${e.text}` }, (e.time ? e.time + " " : "") + e.text)),
      evs.length > 3 ? el("span", { class: "more" }, `+${evs.length - 3}`) : null));
  }
  $("cal").replaceChildren(...cells);
  $("day-title").textContent = dayName(pick) + (pick === t ? " · 오늘" : "");
  const evs = evOf(pick);
  $("day-list").replaceChildren(...(evs.length ? evs.map(e => evRow(e)) : [el("p", { class: "empty" }, "일정이 없어요. 아래에서 넣어요.")]));
  const end = new Date(); end.setDate(end.getDate() + 6); const e7 = iso(end);
  const week = J.events.filter(e => e.date >= t && e.date <= e7).sort((a, b) => (a.date + (a.time || "99")).localeCompare(b.date + (b.time || "99")));
  $("week-list").replaceChildren(...(week.length ? week.map(e => evRow(e, true)) : [el("p", { class: "empty" }, "앞으로 7일 동안 일정이 없어요.")]));
}
$("cal-prev").onclick = () => { month.setMonth(month.getMonth() - 1); calDraw(); };
$("cal-next").onclick = () => { month.setMonth(month.getMonth() + 1); calDraw(); };
$("cal-today").onclick = () => { month = new Date(); month.setDate(1); pick = today(); calDraw(); };
$("ev-form").onsubmit = e => {
  e.preventDefault();
  const text = $("ev-text").value.trim(); if (!text) return;
  J.events.push({ id: uid(), date: pick, time: $("ev-time").value, text, done: false }); store();
  $("ev-text").value = ""; $("ev-time").value = ""; calDraw();
};
// 시간을 넣은 일정: 그 시간이 되면 이 창에서만 알려 줌 (학생 화면에는 안 나옴)
const rung = new Set();
setInterval(() => {
  const n = new Date(), hm = n.toTimeString().slice(0, 5), t = today();
  for (const e of J.events) if (e.date === t && e.time === hm && !e.done && !rung.has(e.id)) {
    rung.add(e.id);
    const box = el("div", { class: "ring", onclick: () => box.remove() }, el("div", {}, el("b", {}, `⏰ ${e.time}`), el("p", {}, e.text), el("button", { class: "main" }, "확인")));
    document.body.append(box);
    try { const a = new AudioContext(); [880, 1175, 880, 1175].forEach((f, i) => { const o = a.createOscillator(), g = a.createGain(), at = a.currentTime + i * .18; o.frequency.value = f; o.type = "triangle"; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.18, at); g.gain.exponentialRampToValueAtTime(.001, at + .16); o.start(at); o.stop(at + .16); }); } catch (er) {}
    window.focus();
  }
}, 5000);

// ── 📝 학생 행동 기록
let who = "", kind = "칭찬", kindFilter = "", editing = null;
function scoreLog(p) { // 우리반 점수 기록 (보기만)
  let r = {}; try { r = JSON.parse(localStorage.getItem("reward")) || {}; } catch (e) {}
  return (r.log || []).filter(l => !p || (l.who || []).includes(p) || l.from === p).map(l => ({ score: 1, date: iso(new Date(l.at)), p: p || (l.who || []).join(", "), kind: "점수", text: `${l.d > 0 ? "+" : ""}${l.d || ""} ${(r.unit || "점").trim()} ${l.why || ""}`.trim(), at: l.at }));
}
function shown() {
  const q = $("rec-q").value.trim();
  let rows = J.recs.filter(r => (!who || r.p === who) && (!kindFilter || r.kind === kindFilter) && (!q || r.text.includes(q) || nameOf(r.p).includes(q)));
  if ($("rec-score").checked && !kindFilter) rows = rows.concat(scoreLog(who).filter(r => !q || r.text.includes(q)));
  return rows.sort((a, b) => (b.date + (b.at || 0)).localeCompare(a.date + (a.at || 0)) || (b.at || 0) - (a.at || 0));
}
function recDraw() {
  const ppl = people(), cnt = p => J.recs.filter(r => r.p === p).length;
  $("kids").replaceChildren(el("button", { class: "kid" + (!who ? " on" : ""), onclick: () => { who = ""; recDraw(); } }, el("i"), el("span", {}, "전체"), el("small", {}, String(J.recs.length))),
    ...ppl.map(p => el("button", { class: "kid" + (who === p ? " on" : ""), onclick: () => { who = p; $("rec-who").value = p; recDraw(); } }, el("i", {}, numOf(p)), el("span", {}, nameOf(p)), el("small", {}, cnt(p) ? String(cnt(p)) : ""))),
    ...(ppl.length ? [] : [el("p", { class: "empty" }, "보드 ⚙ 설정 → 명단에 학생을 넣어 주세요.")]));
  const sel = $("rec-who"), keep = sel.value || who;
  sel.replaceChildren(el("option", { value: "" }, "학생 고르기"), ...ppl.map(p => el("option", { value: p }, `${numOf(p)} ${nameOf(p)}`)));
  sel.value = who || keep || "";
  $("rec-kinds").replaceChildren(...KINDS.map(([k, c]) => { const b = el("button", { class: kind === k ? "on" : "", style: kind === k ? `background:${c}` : "", onclick: () => { kind = k; recDraw(); } }, k); return b; }));
  $("rec-filter").replaceChildren(el("option", { value: "" }, "모든 종류"), ...KINDS.map(([k]) => el("option", { value: k }, k))); $("rec-filter").value = kindFilter;
  $("rec-title").textContent = who ? `${numOf(who)}번 ${nameOf(who)}` : "전체 기록";
  $("print-title").textContent = `학생 행동 기록 · ${who ? nameOf(who) : "전체"} (${new Date().toLocaleDateString("ko-KR")})`;
  const rows = shown();
  $("rec-list").replaceChildren(...(rows.length ? rows.map(r => {
    if (r.score) return el("div", { class: "rec score" }, el("span", { class: "d" }, r.date.slice(2).replace(/-/g, ".")), el("span", { class: "who" }, who ? "" : r.p.split(", ").map(nameOf).join(", ")), el("span", { class: "txt" }, el("span", { class: "k" }, "점수"), r.text), el("span"));
    if (editing === r) {
      const ta = el("textarea"); ta.value = r.text;
      const d = el("input", { type: "date", value: r.date });
      return el("div", { class: "rec" }, d, el("span", { class: "who" }, nameOf(r.p)), ta, el("span", { class: "acts" }, el("button", { class: "main", onclick: () => { r.text = ta.value.trim() || r.text; r.date = d.value || r.date; editing = null; store(); recDraw(); } }, "저장"), el("button", { onclick: () => { editing = null; recDraw(); } }, "취소")));
    }
    return el("div", { class: "rec" }, el("span", { class: "d" }, r.date.slice(2).replace(/-/g, ".")), el("span", { class: "who" }, who ? "" : nameOf(r.p)),
      el("span", { class: "txt" }, el("span", { class: "k", style: `background:${kindColor(r.kind)}` }, r.kind), r.text),
      el("span", { class: "acts" }, el("button", { class: "x", title: "고치기", onclick: () => { editing = r; recDraw(); } }, "✎"), el("button", { class: "x", title: "지우기", onclick: async () => { if (await ask("이 기록을 지울까요?", "지우기")) { J.recs = J.recs.filter(x => x !== r); store(); recDraw(); } } }, "✕")));
  }) : [el("p", { class: "empty" }, who ? "아직 기록이 없어요. 위에서 써요." : "아직 기록이 없어요. 학생을 고르고 위에서 써요.")]));
}
function recSave() {
  const p = $("rec-who").value, text = $("rec-text").value.trim();
  if (!p) return ask("학생을 먼저 골라 주세요.", "확인", null);
  if (!text) return $("rec-text").focus();
  J.recs.push({ id: uid(), date: $("rec-date").value || today(), p, kind, text, at: Date.now() }); store();
  $("rec-text").value = ""; recDraw(); $("rec-text").focus();
}
$("rec-save").onclick = recSave;
$("rec-text").onkeydown = e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); recSave(); } };
$("rec-who").onchange = () => { who = $("rec-who").value; recDraw(); };
$("rec-filter").onchange = () => { kindFilter = $("rec-filter").value; recDraw(); };
$("rec-q").oninput = recDraw; $("rec-score").onchange = recDraw;
$("rec-copy").onclick = async () => {
  const text = shown().map(r => `${r.date} ${who ? "" : nameOf(r.p.split(", ")[0]) + " "}[${r.kind}] ${r.text}`).join("\n");
  try { await navigator.clipboard.writeText(text); $("rec-copy").textContent = "복사했어요"; setTimeout(() => $("rec-copy").textContent = "복사", 1500); } catch (e) { ask("복사하지 못했어요.", "확인", null); }
};
$("rec-print").onclick = () => print();
$("rec-date").value = today();

// ── 🗒️ 오늘의 일지
let nday = today(), saveT = 0;
function noteDraw() {
  $("note-title").textContent = dayName(nday) + (nday === today() ? " · 오늘" : "");
  if (document.activeElement !== $("note") || $("note").dataset.day !== nday) { $("note").value = J.notes[nday] || ""; $("note").dataset.day = nday; }
  const days = Object.keys(J.notes).filter(d => J.notes[d].trim()).sort().reverse();
  $("dates").replaceChildren(...(days.length ? days.map(d => el("button", { class: d === nday ? "on" : "", onclick: () => { nday = d; noteDraw(); } }, dayName(d), el("small", {}, J.notes[d].split("\n")[0]))) : [el("p", { class: "empty" }, "아직 쓴 날이 없어요.")]));
}
const shift = n => { const d = new Date(nday + "T12:00"); d.setDate(d.getDate() + n); nday = iso(d); noteDraw(); };
$("note-prev").onclick = () => shift(-1); $("note-next").onclick = () => shift(1); $("note-today").onclick = () => { nday = today(); noteDraw(); };
$("note").oninput = () => {
  const v = $("note").value, d = $("note").dataset.day;
  if (v.trim()) J.notes[d] = v; else delete J.notes[d];
  $("note-saved").textContent = "저장하는 중…"; clearTimeout(saveT);
  saveT = setTimeout(() => { store(); $("note-saved").textContent = "저장했어요"; noteDraw(); }, 600);
};

// 다른 창(보드, 다른 일지 창)에서 바뀌면 다시 그림: 명단·점수·로그인해서 받은 일지
addEventListener("storage", e => { if (["journal", "roster", "reward", null].includes(e.key)) { load(); draw(); } });
// 학생이 보는 모니터에 떴으면(#cover) 평범한 보드 화면처럼 덮어 둠. 메인 모니터로 옮긴 뒤 두 번 누르면 열림
const coverSync = () => { $("cover").hidden = location.hash !== "#cover"; };
$("cover-date").textContent = new Date().toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "long" });
$("cover").ondblclick = () => history.replaceState(null, "", location.pathname) || coverSync();
addEventListener("hashchange", coverSync); coverSync();
load(); showTab(tab);
setInterval(() => { if (tab === "cal" && !document.querySelector(".evrow input:focus")) calDraw(); }, 60000); // 날이 바뀌면 오늘 표시
</script>
</body>

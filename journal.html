// 저장: localStorage "journal" = { events: [{ id, date, time, text, done }], recs: [{ id, date, ps: [학생], kind, text, at }],
//   counsels: [{ id, date, time, ps, target(학생·학부모·기타), way(대면·전화·문자·온라인), topic, text, next(후속 조치), at }], notes: { "YYYY-MM-DD": 글 } }
//   info: { 학생: { birth, phone, addr, main(주 보호자 "1"·"2"), g1rel, g1name, g1phone, g2rel, g2name, g2phone, memo } }, att: { 날짜: { 학생: { t(결석·지각·조퇴·결과), r(질병·미인정·기타), m } } },
//   box: [{ id, type(link·memo), title, url, text, tag(폴더), at }], boxFolders: [폴더 이름]
// 보드와 같은 저장소라 보드에서 로그인해 두면 서버에도 올라감 (보드가 storage 이벤트로 알아채고, 꺼져 있으면 sync-dirty로 다음에)
const $ = id => document.getElementById(id);

  if (p && (Math.abs(screenX - p.x) > 30 || Math.abs(screenY - p.y) > 30 || Math.abs(outerWidth - p.w) > 30 || Math.abs(outerHeight - p.h) > 30)) { resizeTo(p.w, p.h); moveTo(p.x, p.y); } // 크기만 달라도 맞춤. 앱으로 켠 창도 (브라우저가 막으면 그냥 넘어감)
  setTimeout(() => { if (location.hash === "#cover" && opener && !onBoard()) { history.replaceState(null, "", location.pathname); coverSync(); } }, 300);
} catch (e) {}
load(); showTab(tab);
setInterval(() => { if (tab === "cal" && !document.querySelector(".pop-wrap, .addmenu")) calDraw(); }, 60000); // 날이 바뀌면 오늘 표시
</script>

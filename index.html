  :root { --bg: #fbf3e4; --ink: #2b1d14; --accent: #e2643f; --line: #ead8bf; --muted: #a8927c; }

         color: var(--ink); font-family: "GangwonEdu", "Malgun Gothic", sans-serif; app-region: drag; -webkit-app-region: drag; }
  p { margin: 0; word-break: keep-all; }
  .label { display: flex; align-items: center; gap: 6px; font-size: 21px; color: var(--accent); }

  footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 10px; border-top: 2px dashed var(--line); }
  .rule-line { font-size: 26px; color: var(--accent); }
  #rule { outline: none; border-radius: 4px; padding: 0 2px; app-region: no-drag; -webkit-app-region: no-drag; cursor: text; }
  #rule[contenteditable="true"] { background: #fff; box-shadow: 0 0 0 2px var(--line); }
  .hint { font-size: 13px; color: var(--muted); }
  .tools { flex: none; display: flex; align-items: center; gap: 8px; font-family: "Malgun Gothic", sans-serif;
           app-region: no-drag; -webkit-app-region: no-drag; }
  .tools button { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: #fff; color: var(--accent);
                  font-size: 22px; line-height: 1; cursor: pointer; padding: 0; }
  .tools button:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* 사용 체크: 알약 모양 토글 */
  .used { display: flex; align-items: center; gap: 6px; height: 40px; box-sizing: border-box; padding: 0 14px; border-radius: 999px;
          border: 1.5px solid var(--line); background: #fff; color: var(--muted); font-size: 13px; cursor: pointer; white-space: nowrap; user-select: none; }
  .used input { appearance: none; width: 16px; height: 16px; margin: 0; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-content: center; }
  .used input::after { content: "✓"; font-size: 11px; color: var(--accent); display: none; }
  .used:has(input:checked) { background: var(--accent); border-color: var(--accent); color: #fff; }
  .used input:checked { background: #fff; border-color: #fff; }
  .used input:checked::after { display: block; }
  .used:has(input:focus-visible), .tools button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

// 사용 기록: { 주제번호: "YYYY-MM-DD" } — 이 브라우저에만 저장됨
const KEY = "usedTopics";
let used = {};
try { used = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(used)); } catch (e) {} };

// 아직 안 쓴 주제를 먼저 뽑고, 다 썼으면 전체에서 뽑기
const unused = TOPICS.map((_, i) => i).filter(i => !used[i]);
const pool = unused.length ? unused : TOPICS.map((_, i) => i);
// 창을 껐다 켜도 같은 주제 유지. ↻ 버튼을 눌러야 새 주제
let idx = NaN;
try { idx = parseInt(localStorage.getItem("current"), 10); } catch (e) {}
if (!(idx >= 0 && idx < TOPICS.length)) {
  idx = pool[Math.floor(Math.random() * pool.length)];
  try { localStorage.setItem("current", idx); } catch (e) {}
}
function nextTopic() {
  try { localStorage.removeItem("current"); } catch (e) {}
  location.reload();
}

const check = document.getElementById("check");
const usedEl = document.getElementById("used");
document.getElementById("topic").textContent = TOPICS[idx];

// 마지막 줄: 더블클릭해서 고치고 Enter 또는 바깥 클릭으로 저장
const rule = document.getElementById("rule");
try { rule.textContent = localStorage.getItem("rule") || "2줄 이상 쓰기"; } catch (e) { rule.textContent = "2줄 이상 쓰기"; }
rule.addEventListener("dblclick", () => { rule.contentEditable = "true"; rule.focus(); });
rule.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); rule.blur(); } });
rule.addEventListener("blur", () => {
  rule.contentEditable = "false";
  rule.textContent = rule.textContent.trim() || "2줄 이상 쓰기";
  try { localStorage.setItem("rule", rule.textContent); } catch (e) {}
});

function show() {
  check.checked = !!used[idx];
  usedEl.textContent = used[idx] ? `${used[idx].slice(5).replace("-", "/")} 사용` : "사용 체크"; // 짧게 "11/19 사용"
  usedEl.parentElement.title = used[idx] ? `${used[idx]}에 사용함` : "이 주제를 사용한 날짜 기록";
}
check.addEventListener("change", () => {
  if (check.checked) used[idx] = new Date().toLocaleDateString("sv-SE"); // sv-SE = YYYY-MM-DD, 내 컴퓨터 시간 기준
  else delete used[idx];
  save();
  show();
});
show();

// 앱 창으로 처음 열 때만 창 크기를 맞춤. 이후엔 선생님이 조절한 크기를 브라우저가 기억함
try {
  if (!matchMedia("(display-mode: browser)").matches && localStorage.getItem("sized") !== "3") {
    resizeTo(720, 300);
    localStorage.setItem("sized", "3");
  }
} catch (e) {}
